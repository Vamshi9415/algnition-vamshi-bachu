name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install core dependencies (no heavy ML)
        run: |
          pip install pandas numpy scikit-learn lightgbm pyyaml loguru holidays pytest pytest-asyncio fastapi httpx pydantic python-dotenv

      - name: Run unit tests (skip integration if CSV absent)
        run: |
          pytest tests/test_detector.py tests/test_validator.py tests/test_cleaner.py tests/test_feature_store.py -v --tb=short
