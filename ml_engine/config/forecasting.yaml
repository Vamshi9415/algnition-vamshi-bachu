# Forecasting model configuration

horizon_days: 60
confidence_levels: [0.10, 0.50, 0.90]

models:
  lightgbm:
    enabled: true
    num_leaves: 63
    n_estimators: 500
    learning_rate: 0.05
    subsample: 0.8
    colsample_bytree: 0.8
    min_child_samples: 20
    quantiles: [0.10, 0.50, 0.90]
    log_target: false        # train on log1p(revenue); re-verified NEGATIVE on true leak-free data (see reports/recipe_verification.md errata)
    target_encoding: false   # campaign x dow mean revenue; disabled - overfits holdout (see reports/recipe_verification.md)
    conformal: true          # split-conformal interval calibration; lifts P10-P90 coverage to ~nominal 80%
    calibration_fraction: 0.2 # fraction of training history held out to calibrate the interval width
    conformal_per_channel: false # one factor per channel; verified neutral here (coverage split is temporal drift, not between-channel)

  prophet:
    enabled: true
    seasonality_mode: multiplicative
    yearly_seasonality: true
    weekly_seasonality: true
    daily_seasonality: false
    changepoint_prior_scale: 0.05
    seasonality_prior_scale: 10

  autogluon:
    enabled: false  # heavy dependency, enable if available
    presets: medium_quality
    time_limit: 120

ensemble:
  method: weighted_average
  weights:
    lgbm: 0.45
    prophet: 0.35

cross_validation:
  n_splits: 3
  test_size_days: 30
  gap_days: 0

backtest:
  n_windows: 3
  window_size_days: 30
