# LLM insight generation configuration

model: gemini-2.5-flash
max_tokens: 800
temperature: 0.3

prompt_templates:
  executive_summary: |
    You are a senior digital marketing analyst.
    Given the following forecast data, write a concise 3-paragraph executive summary.
    Use plain language a marketing director would understand.
    Highlight: expected revenue, confidence range, top-performing campaigns, and key risks.

  budget_recommendation: |
    You are an expert media planner.
    Based on the following ROAS and budget simulation data, recommend specific budget changes.
    Be precise (e.g., 'Increase Google Search by $500/day').
    Explain the expected impact in revenue terms.

  risk_analysis: |
    You are a risk analyst for a digital marketing agency.
    Identify the top 3 risks in the following campaign performance data.
    For each risk, state: what it is, why it matters, and what to do about it.
