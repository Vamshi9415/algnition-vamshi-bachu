# Logging configuration for AIgnition Forecast Studio
version: 1
formatters:
  standard:
    format: "{time:YYYY-MM-DD HH:mm:ss} | {level} | {name}:{function}:{line} | {message}"

sinks:
  console:
    sink: sys.stdout
    level: INFO
    colorize: true
    format: "<green>{time:HH:mm:ss}</green> | <level>{level: <8}</level> | <cyan>{name}</cyan> - <level>{message}</level>"

  file:
    sink: logs/aignition_{time:YYYY-MM-DD}.log
    level: DEBUG
    rotation: "10 MB"
    retention: "7 days"
    compression: zip
    format: "{time:YYYY-MM-DD HH:mm:ss} | {level} | {name}:{function}:{line} | {message}"

  error_file:
    sink: logs/errors_{time:YYYY-MM-DD}.log
    level: ERROR
    rotation: "10 MB"
    retention: "30 days"
